name: Build KRONIKARZ.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Sprawdzenie kodu (vet)
        run: go vet ./...

      - name: Build KRONIKARZ.exe (Windows, bez konsoli)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags "-H=windowsgui -s -w" -o KRONIKARZ.exe .

      - name: Build KRONIKARZ_DEBUG.exe (Windows, z konsolą)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o KRONIKARZ_DEBUG.exe .

      - name: Przygotowanie paczki
        run: |
          mkdir -p dist/kronikarz/data/characters dist/kronikarz/data/adventures \
                   dist/kronikarz/data/avatars dist/kronikarz/data/backgrounds dist/kronikarz/data/exports
          touch dist/kronikarz/data/characters/.keep dist/kronikarz/data/adventures/.keep \
                dist/kronikarz/data/avatars/.keep dist/kronikarz/data/backgrounds/.keep \
                dist/kronikarz/data/exports/.keep
          cp KRONIKARZ.exe KRONIKARZ_DEBUG.exe dist/kronikarz/
          cp URUCHOM_KRONIKARZ.bat URUCHOM_DEBUG.bat SPRAWDZ_AI.bat README.txt WERSJA.txt dist/kronikarz/
          cd dist && zip -r kronikarz-windows.zip kronikarz

      - name: Publikacja artefaktu (exe)
        uses: actions/upload-artifact@v4
        with:
          name: KRONIKARZ-windows
          path: |
            KRONIKARZ.exe
            KRONIKARZ_DEBUG.exe
          if-no-files-found: error

      - name: Publikacja artefaktu (paczka ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: kronikarz-windows-zip
          path: dist/kronikarz-windows.zip
          if-no-files-found: error

      - name: Wydanie (release) dla tagu vX.Y.Z
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            KRONIKARZ.exe KRONIKARZ_DEBUG.exe dist/kronikarz-windows.zip \
            --title "KRONIKARZ ${GITHUB_REF_NAME}" \
            --notes "Automatyczny build Windows dla ${GITHUB_REF_NAME}. Uruchom KRONIKARZ.exe lub URUCHOM_KRONIKARZ.bat." \
            --clobber
